<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <meta charset="utf-8"/>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/global.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="main">
    <header class="navbar">
        <nav class="left" aria-label="Primary navigation">
            <a class="menu" href="#menu">
                <span class="text-wrapper">menu</span>
            </a>
            <a class="explore" href="#explore">
                <span class="text-wrapper">explore</span>
            </a>
            <a class="locations" href="#locations">
                <span class="text-wrapper">locations</span>
            </a>
        </nav>
        <div class="logo-container">
            <h1 class="div">Restaurant</h1>
        </div>
        <nav class="right" aria-label="Social media and booking">
            <a href="#" aria-label="Instagram">
                <img class="social-media" src="{{ url_for('static', filename='images/ins.svg') }}" alt="">
            </a>
            <a href="#" aria-label="Facebook">
                <img class="social-media" src="{{ url_for('static', filename='images/face.svg') }}" alt="">
            </a>
            <a href="#" aria-label="TikTok">
                <img class="social-media" src="{{ url_for('static', filename='images/tiktok.svg') }}" alt="">
            </a>
            <a href="#" aria-label="YouTube">
                <img class="social-media" src="{{ url_for('static', filename='images/zalo.svg') }}" alt="">
            </a>
            <button class="book-container" type="button">
                <span class="book">{{current_user.name}}</span>
            </button>
        </nav>
    </header>
</div>
</body>
</html>
