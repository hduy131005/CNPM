<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Quản lý bàn</title>
    <link href="{{ url_for('static', filename='css/table.css') }}" rel="stylesheet">
</head>
<body>

<div class="container">

    <header class="header">
        <h2>QUẢN LÝ BÀN</h2>
    </header>

    <main class="table-container">

        <div class="floor-filter">
            <button class="active">Tầng trệt</button>
            <button>Tầng 1</button>
            <button>Tầng 2</button>
        </div>

        <div class="table-list">

            <div class="table-card available">
                <span class="table-name">A1</span>
                <span class="table-status">Trống</span>
            </div>

            <div class="table-card occupied">
                <span class="table-name">A2</span>
                <span class="table-status">Đang sử dụng</span>
            </div>

            <div class="table-card available">
                <span class="table-name">A3</span>
                <span class="table-status">Trống</span>
            </div>

            <div class="table-card cooking">
                <span class="table-name">A4</span>
                <span class="table-status">Đang phục vụ</span>
            </div>

            <div class="table-card available">
                <span class="table-name">A5</span>
                <span class="table-status">Trống</span>
            </div>

            <div class="table-card occupied">
                <span class="table-name">A6</span>
                <span class="table-status">Đang sử dụng</span>
            </div>

            <div class="table-card available">
                <span class="table-name">A7</span>
                <span class="table-status">Trống</span>
            </div>

            <div class="table-card available">
                <span class="table-name">A8</span>
                <span class="table-status">Trống</span>
            </div>

            <div class="table-card occupied">
                <span class="table-name">A9</span>
                <span class="table-status">Đang sử dụng</span>
            </div>

            <div class="table-card available">
                <span class="table-name">A10</span>
                <span class="table-status">Trống</span>
            </div>

        </div>

        <div class="table-legend">
            <span><i class="dot available-dot"></i> Trống</span>
            <span><i class="dot occupied-dot"></i> Đang sử dụng</span>
            <span><i class="dot cooking-dot"></i> Đang phục vụ</span>
        </div>

    </main>

</div>

</body>
</html>
