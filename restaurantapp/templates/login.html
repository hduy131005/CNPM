<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>
<main class="login">
    <section class="form-wrap">
        <h2>Đăng nhập</h2>
        <p class="sub">Nhập email và mật khẩu của bạn.</p>

        <form action="#" method="post">
            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="ten@example.com" autocomplete="email" required>
            </div>

            <div class="field">
                <label for="password">Mật khẩu</label>
                <div class="password-row">
                    <input type="password" id="password" name="password" autocomplete="current-password" required>
                    <button type="button" class="toggle" id="toggle" aria-controls="password">Hiện</button>
                </div>
            </div>
            <p class="err">{{err_msg}}</p>
            <div class="options">
                <label class="remember">
                    <input type="checkbox" name="remember"> Ghi nhớ đăng nhập
                </label>
                <a href="#">Quên mật khẩu?</a>
            </div>

            <button type="submit" class="submit">Đăng nhập</button>
        </form>

        <p class="signup">Chưa có tài khoản? <a href="#">Tạo tài khoản</a></p>
    </section>
</main>

<script>
    // Hiện / ẩn mật khẩu
    const input = document.getElementById("password");
    const toggle = document.getElementById("toggle");
    toggle.addEventListener("click", () => {
      const show = input.type === "password";
      input.type = show ? "text" : "password";
      toggle.textContent = show ? "Ẩn" : "Hiện";
    });
</script>
</body>
</html>
